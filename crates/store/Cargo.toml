[package]
name = "store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQLite persistence: the content the dashboard edits, contact messages and their replies, admin login."

[dependencies]
content.workspace = true
serde = "1"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
sha2 = "0.10"
getrandom = "0.3"

[dev-dependencies]
tokio = { workspace = true }
