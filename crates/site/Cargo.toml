[package]
name = "site"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
leptos_axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
bridge.workspace = true
content.workspace = true
contact.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive"] }
store = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
web-sys = { workspace = true, features = [
  "Window", "Document", "Element", "HtmlElement", "CssStyleDeclaration",
  "DomTokenList", "MediaQueryList", "EventTarget", "Event", "PointerEvent", "MouseEvent",
  "HtmlCanvasElement", "Node", "IntersectionObserver", "IntersectionObserverEntry",
  "IntersectionObserverInit", "Navigator", "VisibilityState", "KeyboardEvent", "History", "Location",
  "HtmlMediaElement", "HtmlVideoElement", "Performance", "DomRect",
  "Headers", "Request", "RequestInit", "RequestCredentials", "Response",
  "AddEventListenerOptions", "Storage", "FormData", "File", "FileList", "Blob", "HtmlInputElement",
] }

[build-dependencies]
content = { workspace = true, features = ["parse"] }

[features]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook"]
ssr = ["leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr", "dep:leptos_axum", "dep:http", "dep:store", "contact/server", "content/parse"]
